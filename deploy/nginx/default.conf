# 霓虹突袭 · 静态站 + 国内 Release 下载
# 容器内路径由 compose 外挂：
#   /usr/share/nginx/html  ← 宿主机 www/
#   /data/releases         ← 宿主机 files/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # GitHub Releases 风格直链：/releases/download/v1.1.13/foo.apk
    # → 宿主机 /data/neonassault/files/v1.1.13/foo.apk
    location /releases/download/ {
        alias /data/releases/;
        autoindex off;
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
        types { }
        default_type application/octet-stream;
    }

    location /releases/ {
        try_files $uri $uri/ /releases/index.html;
    }

    location ~* \.(js|css|webp|png|jpg|jpeg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
