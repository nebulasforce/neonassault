# 腾讯云：Docker nginx + 宿主机外挂目录
# 宿主机目录（REMOTE_DIR=/data/neonassault）：
#   www/                 游戏静态站（build-web 产物）
#   files/vX.Y.Z/*.apk   GitHub Release 安装包
#   nginx/default.conf   站点配置（只读挂进容器）
#   logs/                nginx access/error
# 端口：外网 80 → 容器 80
# 日常热更静态文件：rsync www/ 即可，不必重建镜像

services:
  web:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    container_name: neonassault-web
    restart: unless-stopped
    ports:
      - "${NA_HTTP_PORT:-80}:80"
    volumes:
      - ${NA_DATA_DIR:-/data/neonassault}/www:/usr/share/nginx/html:ro
      - ${NA_DATA_DIR:-/data/neonassault}/files:/data/releases:ro
      - ${NA_DATA_DIR:-/data/neonassault}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NA_DATA_DIR:-/data/neonassault}/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
