name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允许一个部署任务并发跑，但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # web/ 是纯静态资源，无需构建；这里只做一次完整性校验
      - name: Verify web assets
        run: |
          test -f web/index.html || (echo "missing web/index.html" && exit 1)
          test -f web/game.js   || (echo "missing web/game.js" && exit 1)
          test -f web/manifest.json || (echo "missing web/manifest.json" && exit 1)
          echo "web assets ok"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 首次部署时 Pages 站点可能尚未创建。仓库 Settings 里手动开启需要一次点击，
      # 而工作流内的 GITHUB_TOKEN 具备 pages: write，可以在这里自动补上。
      - name: Ensure Pages site exists
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages 已启用：${data.html_url || data.status || 'ok'}`);
            } catch (err) {
              if (err.status !== 404) throw err;
              core.info('Pages 尚未启用，正在创建（build_type=workflow）…');
              try {
                await github.rest.repos.createPagesSite({
                  owner, repo,
                  build_type: 'workflow',
                  source: { branch: 'main', path: '/' }
                });
                core.info('Pages 创建成功');
              } catch (e) {
                core.warning(
                  '自动创建 Pages 失败，请在仓库 Settings → Pages → Source 选择 "GitHub Actions" 后重跑本工作流。' +
                  ` 错误：${e.message}`
                );
              }
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
