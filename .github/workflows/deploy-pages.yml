name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

# 只允许一个部署任务并发跑，但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # configure-pages 在 Pages 站点尚未启用时会直接失败，所以先尝试自动建站。
      # 失败只降级为 warning（不阻断），把具体错误打进日志，便于定位。
      - name: Ensure Pages enabled
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages already enabled: ${data.html_url || data.status || 'ok'}`);
            } catch (err) {
              if (err.status !== 404) {
                core.warning(`Query Pages failed: HTTP ${err.status} - ${err.message}`);
              } else {
                core.info('Pages not enabled yet, trying to create site (build_type=workflow)...');
                try {
                  await github.rest.repos.createPagesSite({
                    owner,
                    repo,
                    build_type: 'workflow',
                  });
                  core.info('Pages site created successfully');
                } catch (e) {
                  core.warning(`Auto-create Pages failed: HTTP ${e.status} - ${e.message}`);
                  core.warning('Please enable Pages manually: Settings -> Pages -> Source -> "GitHub Actions", then re-run this workflow.');
                }
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # web/ 是纯静态资源，无需构建；这里只做一次完整性校验
      - name: Verify web assets
        run: |
          test -f web/index.html || (echo "missing web/index.html" && exit 1)
          test -f web/game.js   || (echo "missing web/game.js" && exit 1)
          test -f web/manifest.json || (echo "missing web/manifest.json" && exit 1)
          echo "web assets ok"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
