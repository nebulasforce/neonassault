name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署任务并发跑，但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages 站点必须先在仓库设置里启用一次（Settings → Pages → Source → "GitHub Actions"）。
      # GITHUB_TOKEN 缺少 Administration 权限，无法在 workflow 内自动建站，这里只做检查 + 友好提示。
      - name: Check Pages enabled
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages enabled: ${data.html_url || data.status || 'ok'}`);
            } catch (err) {
              if (err.status === 404) {
                core.warning('Pages 尚未启用。请到仓库 Settings → Pages → Source 选择 "GitHub Actions" 并保存，然后重跑本工作流。');
              } else {
                core.warning(`查询 Pages 状态失败: HTTP ${err.status} - ${err.message}`);
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # web/ 是纯静态资源，无需构建；这里只做一次完整性校验
      - name: Verify web assets
        run: |
          test -f web/index.html || (echo "missing web/index.html" && exit 1)
          test -f web/game.js   || (echo "missing web/game.js" && exit 1)
          test -f web/manifest.json || (echo "missing web/manifest.json" && exit 1)
          echo "web assets ok"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
