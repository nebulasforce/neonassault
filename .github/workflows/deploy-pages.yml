name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允许一个部署任务并发跑，但不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # configure-pages 在 Pages 站点不存在时会直接失败，所以建站必须排在它前面。
      # 用 gh api 直连：失败信息会原样打印在日志里，便于排查。
      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "检查 Pages 站点…"
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "✓ Pages 已启用"
          else
            echo "Pages 尚未启用，尝试创建（build_type=workflow）…"
            if gh api --method POST "repos/${{ github.repository }}/pages" \
                 -H "Accept: application/vnd.github+json" \
                 -f build_type=workflow \
                 -F 'source[branch]=main' \
                 -F 'source[path]=/'; then
              echo "✓ Pages 创建成功"
            else
              echo "::warning::自动创建 Pages 失败。请到仓库 Settings → Pages → Source 选 'GitHub Actions' 后重跑本工作流。"
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # web/ 是纯静态资源，无需构建；这里只做一次完整性校验
      - name: Verify web assets
        run: |
          test -f web/index.html || (echo "missing web/index.html" && exit 1)
          test -f web/game.js   || (echo "missing web/game.js" && exit 1)
          test -f web/manifest.json || (echo "missing web/manifest.json" && exit 1)
          echo "web assets ok"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
