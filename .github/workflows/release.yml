name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to attach this release to (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Capacitor deps
        run: pnpm install --frozen-lockfile --ignore-scripts --registry https://registry.npmjs.org

      - name: Assemble Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          UNI=$(find android/app/build/outputs/apk -name '*universal*.apk' | head -n 1)
          if [ -z "$UNI" ]; then
            UNI=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          fi
          test -n "$UNI"
          cp "$UNI" dist/neonassault-android-universal.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/neonassault-android-universal.apk
          if-no-files-found: error

  harmonyos:
    name: HarmonyOS DevEco zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync web assets and zip project
        run: |
          node scripts/build-harmonyos.js
          mkdir -p dist
          zip -r dist/neonassault-harmonyos-deveco.zip harmonyos \
            -x 'harmonyos/.hvigor/*' \
            -x 'harmonyos/**/build/*' \
            -x 'harmonyos/.idea/*' \
            -x 'harmonyos/**/.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-zip
          path: dist/neonassault-harmonyos-deveco.zip
          if-no-files-found: error

  windows:
    name: Windows Electron
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS deps
        run: |
          printf 'registry=https://registry.npmjs.org\n' > .npmrc
          pnpm install --frozen-lockfile

      - name: Build Windows packages
        run: pnpm exec electron-builder --win --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-electron
          path: |
            dist-electron/*.exe
          if-no-files-found: error

  macos:
    name: macOS Electron
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS deps
        run: |
          printf 'registry=https://registry.npmjs.org\n' > .npmrc
          pnpm install --frozen-lockfile

      - name: Build macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --mac --publish=never -c.mac.identity=null

      - uses: actions/upload-artifact@v4
        with:
          name: macos-electron
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [android, harmonyos, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## 下载

            - **网页 / PWA**：https://nebulasforce.github.io/neonassault/
            - **Android**：`neonassault-android-universal.apk`（debug 签名，可侧载）
            - **Windows**：`neonassault-windows-x64-setup.exe` 安装包，或 `neonassault-windows-x64-portable.exe` 免安装
            - **macOS**：`neonassault-macos-universal.dmg`（未公证，首次请右键 → 打开）
            - **鸿蒙**：GitHub 打不出 HAP。`neonassault-harmonyos-deveco.zip` 已同步 `web/` 和图标，用 DevEco 打开 `harmonyos/` → Build Hap(s)

            各端桌面图标 / 启动图标均由 `web/icons/na-cool-1024.png` 派生（PWA 为 `na-192.png` / `na-512.png`）。
